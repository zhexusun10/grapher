name: Linux Native Graph Boundary

on:
  push:
  pull_request:

jobs:
  linux-native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Graph sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap build-essential git
          test -x /usr/bin/bwrap
          /usr/bin/bwrap --die-with-parent --unshare-user --unshare-pid --cap-drop ALL --bind / / --dev-bind /dev /dev --proc /proc -- /bin/sh -c ': <>/dev/null'
      - name: Install Grapher dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned Pi
        run: npm run pi:setup
      - name: Check production Linux backend and build release binary
        run: |
          cargo check --manifest-path backend/Cargo.toml --no-default-features
          cargo build --release --manifest-path backend/Cargo.toml --bin grapher
          test "$(backend/target/release/grapher --build-identity)" = "$(git rev-parse HEAD)"
      - name: Run Linux sandbox and native tools tests
        timeout-minutes: 8
        run: |
          cargo test --manifest-path backend/Cargo.toml --no-default-features --lib linux_sandbox::tests -- --nocapture
          cargo test --manifest-path backend/Cargo.toml --no-default-features --lib native::tests::graph_launcher_runs_parallel_native_tools_and_absolute_scripts -- --nocapture
      - name: Run production workspace Merger acceptance (local model responses)
        timeout-minutes: 5
        run: npm run test:merger
