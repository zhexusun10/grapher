name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and smoke-test release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            artifact: grapher-linux-x64.tar.gz
          - os: macos-15
            platform: macos
            arch: arm64
            artifact: grapher-macos-arm64.tar.gz
          - os: macos-15-intel
            platform: macos
            arch: x64
            artifact: grapher-macos-x64.tar.gz
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: grapher-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.platform == 'windows' && 'stable-x86_64-pc-windows-msvc' || 'stable' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap build-essential git
      - name: Install Windows native tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install ripgrep fd --yes --no-progress
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install and build Pi
        run: npm run pi:setup
      - name: Build frontend
        run: npm run build
      - name: Build release binary
        run: cargo build --release --manifest-path backend/Cargo.toml --bin grapher
      - name: Create relocatable distribution
        run: node scripts/package-release.mjs ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.artifact }}
      - name: Smoke-test extracted archive outside the checkout
        run: node scripts/smoke-release.mjs ${{ matrix.artifact }} ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Generate checksum
        run: node --input-type=module -e "import {createHash} from 'node:crypto'; import {readFileSync,writeFileSync} from 'node:fs'; const file='${{ matrix.artifact }}'; writeFileSync(file+'.sha256', createHash('sha256').update(readFileSync(file)).digest('hex')+'  '+file+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  create-release:
    name: Create GitHub Release draft
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          else
            printf '# Grapher %s\n\nSee CHANGELOG.md for changes. Download the archive for your platform and verify its SHA256 checksum.\n' "$RELEASE_TAG" > release-notes.md
          fi
      - name: Create or refresh unpublished release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$RELEASE_TAG" in *alpha*|*beta*|*rc*) prerelease=(--prerelease);; esac
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            # Never overwrite assets on a published release.
            [ "$(cat is-draft.txt)" = true ] || { echo 'Refusing to modify a published release'; exit 1; }
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [ ! -f "release-assets/$asset" ]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --draft --title "Grapher $RELEASE_TAG" --notes-file release-notes.md "${prerelease[@]}"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Grapher $RELEASE_TAG" --notes-file release-notes.md "${prerelease[@]}" release-assets/*
          fi
