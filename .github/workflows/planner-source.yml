name: Planner Source Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

# A push that supersedes another push (or a PR update) would otherwise keep a
# whole three-OS matrix queued behind code nobody is waiting for. Keep only the
# newest run per ref; scheduled runs are never cancelled, they are the weekly
# drift check.
concurrency:
  group: planner-source-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  planner-source:
    name: Planner source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # ubuntu/macOS run the cross-platform backend/environment/merger/native
    # suites; Windows skips the ones whose failures also surface on macOS (they
    # cost ~1h there) and keeps its own library and Windows-native acceptance
    # coverage. The host-neutral suites run on Linux for every push and on
    # macOS/Windows only for pull requests, the schedule and dispatch, so a push
    # does not pay three times for behavior that is not host-specific. Platform
    # suites (native launchers, the seatbelt policy, Windows acceptance) keep
    # running on their own host. Rust builds dominate the rest, so the job reuses
    # one target cache per OS instead of recompiling, and the budgets below are
    # sized to a warm run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Compiling the backend cold is the slowest part of every suite below.
      # The cache key follows Cargo.lock and the active toolchain, so a
      # dependency change still rebuilds while a re-run of the same code does not.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Explicit CI prerequisite only for weekly/manual baseline probes; the runtime never installs a project tool.
      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          version: '0.9.5'
          enable-cache: false
      - name: Install Linux tools and verify Graph namespace support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap build-essential git
          /usr/bin/bwrap --die-with-parent --unshare-user --unshare-pid --cap-drop ALL --bind / / --dev-bind /dev /dev --proc /proc -- /bin/sh -c ': <>/dev/null'
      - name: Install macOS tools and verify Seatbelt support
        if: runner.os == 'macOS'
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /bin/sh -c ': <>/dev/null'
      - name: Install Grapher and pinned Pi
        run: |
          npm ci --ignore-scripts
          node scripts/patch-picomatch.mjs
      - run: npm run pi:setup
      - name: Verify development scripts and test inventory
        if: runner.os == 'Linux'
        run: npm run test:scripts
      # Frontend tests run through tsx, which strips types without checking
      # them; type errors would otherwise surface only in the release build.
      # The check is host-neutral, so Linux covers it.
      - name: Type-check the frontend
        if: runner.os == 'Linux'
        run: npm run check
      - name: Verify frontend state, i18n and transcript contracts
        run: npm run test:frontend
      # Cwd and PATH behavior is host-specific; check these fast cases before
      # compiling Rust and running the full native environment acceptance.
      - name: Verify native launch bindings
        run: node --test scripts/environment-launch.test.mjs
      - name: Verify snapshot inheritance, failed revisions and event replay
        if: runner.os != 'Windows'
        run: npm run test:backend
      - name: Verify production HTTP paths and safe workspace cleanup
        run: npm run test:hardening
      - name: Verify the same unmodified Planner Bash on every host
        run: npm run test:planner-bash
      # `test:backend` already runs native::tests and native_runtime_storage::tests
      # with fixture features; only linux_sandbox::tests is non-fixture-only.
      - name: Verify production native launchers and filesystem boundaries
        if: runner.os != 'Windows'
        timeout-minutes: 6
        run: npm run test:native:scripts
      - name: Verify Linux sandbox boundary unit tests
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --lib linux_sandbox::tests
      - name: Verify Windows native launcher scripts
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: npm run test:native:scripts
      - name: Verify prewarm and shared native runtime acceptance
        timeout-minutes: 6
        run: npm run test:prewarm
      - name: Verify macOS filesystem policy with real child processes
        if: runner.os == 'macOS'
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --test sandbox
      - name: Select an explicit short Windows test parent (native package path limits)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"GRAPHER_ENV_TEST_PARENT=C:\g-env-tests" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      # Component cost evidence only on explicit/weekly runs; no release/publication
      # dependency and no timing threshold. Correctness stays in the Rust suites,
      # and missing uv fails the probe rather than falling back to a synthetic pass.
      - name: Measure offline project dependency snapshots (model-free, not sandbox acceptance)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 6
        env:
          GRAPHER_ENV_PROBE_REQUIRE_UV: '1'
          GRAPHER_ENV_PROBE_REPORT: ${{ runner.temp }}/environment-baseline.json
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --features fixture --lib environment_project_baseline -- --ignored --nocapture --test-threads=1
      # Cost comparison only on explicit/weekly runs; no release/publication
      # dependency and no timing threshold. Correctness stays in the Rust suites.
      - name: Compare immutable dependency sealing costs (component probe)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 6
        env:
          GRAPHER_ENV_SEAL_PROBE_REPORT: ${{ runner.temp }}/dependency-sealing.json
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --features fixture --lib environment_dependency_sealing_benchmark -- --ignored --nocapture --test-threads=1
      - name: Retain native-host dependency cost evidence
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: environment-baseline-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/environment-baseline.json
            ${{ runner.temp }}/dependency-sealing.json
          if-no-files-found: warn
          retention-days: 7
      # Other matrix/event paths already run these in backend/environment
      # suites. Windows pushes skip those broad suites, but still need native
      # NTFS root/alias/link and real-interpreter recovery regression coverage.
      - name: Verify Windows root-qualified environment capture and recovery
        if: runner.os == 'Windows' && github.event_name == 'push'
        # The real-interpreter cases can exceed four minutes on hosted NTFS;
        # retain the full sequential coverage with room for native tool I/O.
        timeout-minutes: 10
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --features fixture --lib rooted_ -- --test-threads=1
      # The broader library suites cover protocol/legacy/runtime-input units
      # elsewhere. Windows pushes need them explicitly beside real W/S recovery.
      - name: Verify native runtime recovery evidence on Windows
        if: runner.os == 'Windows' && github.event_name == 'push'
        timeout-minutes: 3
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --features fixture --lib runtime_evidence -- --test-threads=1
      - name: Verify native runtime codeRef byte preflight on Windows
        if: runner.os == 'Windows' && github.event_name == 'push'
        timeout-minutes: 3
        run: |
          node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --features fixture --lib runtime_project_code_proof -- --test-threads=1
          node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --features fixture --lib streaming_git_blob -- --test-threads=1
      # Linux/macOS and non-push Windows runs already cover these through the
      # backend/environment suites. Keep Windows push coverage focused as well.
      - name: Verify trusted Node bootstrap isolation on Windows
        if: runner.os == 'Windows' && github.event_name == 'push'
        timeout-minutes: 4
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --features fixture --lib trusted_node_probe_never_loads -- --test-threads=1
      # The three suites below are host-neutral behavior (native environment
      # admission, Graph chain discovery, merger/publication) and Linux already
      # runs them for every push on the same commit. macOS keeps them for pull
      # requests, the weekly schedule and manual dispatch, where a host-specific
      # drift would show up, instead of adding ~11 minutes to every push; Windows
      # skips them because `test:backend` / Windows library + acceptance runs
      # cover its native surface without hitting the 45-minute job limit.
      # `test:backend` and `environment-launch.test.mjs` already cover the Rust
      # and launch-binding units, so CI invokes `test:environment:acceptance`.
      - name: Verify managed E/L with real native Python, editable package and lifecycle
        if: runner.os == 'Linux' || (runner.os == 'macOS' && github.event_name != 'push')
        timeout-minutes: 10
        run: npm run test:environment:acceptance
      - name: Verify default environment discovery across a Graph chain (local model)
        if: runner.os == 'Linux' || (runner.os == 'macOS' && github.event_name != 'push')
        timeout-minutes: 10
        run: npm run test:environment-chain
      - name: Verify production Planner revisions, dependency composition and Merger (local model)
        if: runner.os == 'Linux' || (runner.os == 'macOS' && github.event_name != 'push')
        timeout-minutes: 10
        run: npm run test:merger
      # The Windows library suite is the same host-neutral Rust suite Linux and
      # macOS already run for a push; Windows keeps it for pull requests, the
      # weekly schedule and manual dispatch, while its Windows-only surface stays
      # covered on every push by the acceptance step below.
      - name: Run the full backend library test suite on Windows
        if: runner.os == 'Windows' && github.event_name != 'push'
        timeout-minutes: 25
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --lib
      # PR/scheduled Windows library runs already include these cases; pushes
      # still need native ACL/identity coverage rather than only launcher tests.
      - name: Verify Windows native ACLs, path identity and snapshot integrity
        if: runner.os == 'Windows' && github.event_name == 'push'
        timeout-minutes: 8
        run: npm run test:filesystem
      - name: Verify Windows native Planner and production Graph acceptance (local model responses)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: npm run test:windows-native
      - name: Verify Tauri v2 desktop shell and packaging contracts
        if: runner.os == 'macOS' || runner.os == 'Windows'
        timeout-minutes: 8
        run: npm run test:desktop

  macos-filesystem:
    name: macOS filesystem / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: |
          npm ci --ignore-scripts
          node scripts/patch-picomatch.mjs
      - name: Verify native ACLs, aliases, POSIX links and snapshot integrity on the host volume
        timeout-minutes: 12
        run: npm run test:filesystem
      - name: Verify the same regressions on case-sensitive APFS
        timeout-minutes: 8
        run: |
          set -euo pipefail
          parent="$(mktemp -d "$RUNNER_TEMP/grapher-apfs.XXXXXX")"
          image="$parent/filesystem.sparseimage"
          volume="$parent/mount"
          device="$volume"
          attached=0
          cleanup() {
            local result=$?
            trap - EXIT
            if [ "$attached" = 1 ]; then
              # A partial detach can remove the mountpoint while APFS still
              # holds the image device open. Retry that device with backoff.
              local attempt
              for attempt in 1 2 3 4 5; do
                if ! diskutil info "$device" >/dev/null 2>&1 || hdiutil detach "$device" || hdiutil detach -force "$device"; then
                  attached=0
                  break
                fi
                if [ "$attempt" -lt 5 ]; then
                  echo "::warning::APFS image $device is busy; retrying detach in ${attempt}s."
                  sleep "$attempt"
                fi
              done
              if [ "$attached" = 1 ] && diskutil info "$device" >/dev/null 2>&1; then
                echo "::error::Could not detach temporary APFS image $device after 5 attempts."
                hdiutil info || true
                if [ "$result" -eq 0 ]; then
                  result=1
                fi
              fi
            fi
            exit "$result"
          }
          trap cleanup EXIT
          mkdir "$volume"
          hdiutil create -size 2g -type SPARSE -fs "Case-sensitive APFS" -volname GrapherCaseSensitive "$image"
          hdiutil attach -nobrowse -owners on -mountpoint "$volume" -plist "$image" > "$parent/attached.plist"
          attached=1
          device="$(/usr/libexec/PlistBuddy -c 'Print :system-entities:0:dev-entry' "$parent/attached.plist")"
          mkdir "$volume/tmp"
          touch "$volume/tmp/CaseProbe"
          if [ -e "$volume/tmp/caseprobe" ]; then
            echo 'Expected a genuinely case-sensitive volume; refusing skipped branch coverage' >&2
            exit 1
          fi
          rm "$volume/tmp/CaseProbe"
          TMPDIR="$volume/tmp" npm run test:filesystem
      # Native FFI/filesystem behavior runs on both architectures; the browser
      # drives the same real UI/backend/Pi path once, without model credentials.
      - name: Install pinned Pi for macOS browser acceptance
        if: matrix.os == 'macos-15'
        run: npm run pi:setup
      - name: Install Playwright Chromium
        if: matrix.os == 'macos-15'
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Verify Graph task and Merger conversation identity
        if: matrix.os == 'macos-15'
        run: node --test --test-name-pattern="literal task IDs and colliding Merger cards|prototype-like and Unicode task IDs|Merger history stays separate" scripts/graph-planning-fit.test.mjs
      - name: Verify macOS browser Graph publication and persistent Serial follow-up
        if: matrix.os == 'macos-15'
        timeout-minutes: 10
        run: npm run test:macos-browser 2>&1 | tee "$RUNNER_TEMP/macos-browser.log"
      - name: Retain macOS browser failure diagnostics
        if: failure() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v6
        with:
          name: macos-browser-${{ matrix.os }}
          path: ${{ runner.temp }}/macos-browser.log
          if-no-files-found: ignore
          retention-days: 7
