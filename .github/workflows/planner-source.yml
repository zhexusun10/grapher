name: Planner Source Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 2'

permissions:
  contents: read

# A push that supersedes another push (or a PR update) would otherwise keep a
# whole three-OS matrix queued behind code nobody is waiting for. Keep only the
# newest run per ref; scheduled runs are never cancelled, they are the weekly
# drift check.
concurrency:
  group: planner-source-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  planner-source:
    name: Planner source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # ubuntu/macOS run the cross-platform backend/environment/merger/native
    # suites; Windows skips the ones whose failures also surface on macOS (they
    # cost ~1h there) and keeps its own library and Windows-native acceptance
    # coverage. The host-neutral suites run on Linux for every push and on
    # macOS/Windows only for pull requests, the schedule and dispatch, so a push
    # does not pay three times for behavior that is not host-specific. Platform
    # suites (native launchers, the seatbelt policy, Windows acceptance) keep
    # running on their own host. Rust builds dominate the rest, so the job reuses
    # one target cache per OS instead of recompiling, and the budgets below are
    # sized to a warm run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Compiling the backend cold is the slowest part of every suite below.
      # The cache key follows backend/Cargo.lock and the active toolchain, so a
      # dependency change still rebuilds while a re-run of the same code does not.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux tools and verify Graph namespace support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap build-essential git
          /usr/bin/bwrap --die-with-parent --unshare-user --unshare-pid --cap-drop ALL --bind / / --dev-bind /dev /dev --proc /proc -- /bin/sh -c ': <>/dev/null'
      - name: Install macOS tools and verify Seatbelt support
        if: runner.os == 'macOS'
        run: |
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /bin/sh -c ': <>/dev/null'
      - name: Install Grapher and pinned Pi
        run: npm ci --ignore-scripts
      - run: npm run pi:setup
      - name: Verify frontend state, i18n and transcript contracts
        run: npm run test:frontend
      - name: Verify snapshot inheritance, failed revisions and event replay
        if: runner.os != 'Windows'
        run: npm run test:backend
      - name: Verify production HTTP paths and safe workspace cleanup
        run: npm run test:hardening
      - name: Verify the same unmodified Planner Bash on every host
        run: npm run test:planner-bash
      - name: Verify production native launchers and filesystem boundaries
        if: runner.os != 'Windows'
        timeout-minutes: 6
        run: npm run test:native
      - name: Verify Windows native launchers and the prewarm contract
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: npm run test:native:scripts
      - name: Verify macOS filesystem policy with real child processes
        if: runner.os == 'macOS'
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --test sandbox
      - name: Select an explicit short Windows test parent (native package path limits)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"GRAPHER_ENV_TEST_PARENT=C:\g-env-tests" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      # The three suites below are host-neutral behavior (native environment
      # admission, Graph chain discovery, merger/publication) and Linux already
      # runs them for every push on the same commit. macOS keeps them for pull
      # requests, the weekly schedule and manual dispatch, where a host-specific
      # drift would show up, instead of adding ~11 minutes to every push.
      - name: Verify managed E/L with real native Python, editable package and lifecycle
        if: runner.os == 'Linux' || github.event_name != 'push'
        timeout-minutes: 25
        run: npm run test:environment
      - name: Verify default environment discovery across a Graph chain (local model)
        if: runner.os == 'Linux' || github.event_name != 'push'
        timeout-minutes: 10
        run: npm run test:environment-chain
      - name: Verify production Planner revisions, dependency composition and Merger (local model)
        if: runner.os == 'Linux' || github.event_name != 'push'
        timeout-minutes: 10
        run: npm run test:merger
      # The Windows library suite is the same host-neutral Rust suite Linux and
      # macOS already run for a push; Windows keeps it for pull requests, the
      # weekly schedule and manual dispatch, while its Windows-only surface stays
      # covered on every push by the acceptance step below.
      - name: Run the full backend library test suite on Windows
        if: runner.os == 'Windows' && github.event_name != 'push'
        timeout-minutes: 25
        run: node scripts/cargo.mjs test --manifest-path backend/Cargo.toml --no-default-features --lib
      - name: Verify Windows native Planner and production Graph acceptance (local model responses)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: npm run test:windows-native
