name: Windows Native Graph

on:
  push:
  pull_request:

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Install native Pi search tools
        shell: pwsh
        run: |
          choco install ripgrep fd --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Failed to install ripgrep/fd" }
          rg --version
          if ($LASTEXITCODE -ne 0) { throw "ripgrep is not executable on PATH" }
          fd --version
          if ($LASTEXITCODE -ne 0) { throw "fd is not executable on PATH" }
      - name: Install Grapher dependencies
        run: npm ci
      - name: Install pinned Pi dependencies and baseline data
        run: npm run pi:setup
      - name: Exercise pinned Pi CLI and Provider/Auth IPC (offline)
        timeout-minutes: 3
        run: node --test scripts/pi-process-contract.test.mjs
      - name: Check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Check production backend
        run: cargo check --manifest-path backend/Cargo.toml --no-default-features
      - name: Run backend library tests
        run: cargo test --manifest-path backend/Cargo.toml --no-default-features --lib
      - name: Run offline Graph, Serial, publication, and recovery fixtures
        timeout-minutes: 10
        run: cargo test --manifest-path backend/Cargo.toml --no-default-features --features fixture --test core --test graph_merge --test shadow --test publication --test publication_state
      - name: Run native path and lifecycle checks
        run: npm run test:native
      - name: Run project binding checks
        run: npm run test:bindings
      - name: Run native Planner and production Graph acceptance (local model responses)
        timeout-minutes: 5
        run: npm run test:windows-native
      - name: Check Planner and Pi extension tools
        env:
          # Provision above, not an implicit GitHub download during tool calls.
          PI_OFFLINE: '1'
        run: npm run test:extensions
