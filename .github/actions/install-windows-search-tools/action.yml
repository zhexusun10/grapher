name: Install Windows search tools
description: >-
  Install ripgrep and fd from Chocolatey, verify both binaries, and retry
  transient community-feed failures.

runs:
  using: composite
  steps:
    - name: Install ripgrep and fd
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # Native command exit codes are handled explicitly below; Chocolatey can
        # also exit 0 after installing only one of the requested packages when
        # the community feed returns a transient 5xx.
        $PSNativeCommandUseErrorActionPreference = $false

        # Verify the actual binaries and retry before failing the job.
        $attempts = 3
        for ($attempt = 1; $attempt -le $attempts; $attempt++) {
          choco install ripgrep fd --yes --no-progress

          # Chocolatey shims live on the machine PATH; refresh this session in
          # case it captured the environment before installation.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath"

          $missing = @('rg', 'fd') | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          if (-not $missing) { break }
          if ($attempt -eq $attempts) {
            throw "Search tools are unavailable after $attempts install attempts (missing: $($missing -join ', '))"
          }
          Write-Host "Attempt $attempt did not provide both search tools; retrying the transient Chocolatey failure."
          Start-Sleep -Seconds 20
        }

        rg --version
        if ($LASTEXITCODE -ne 0) { throw "ripgrep is not executable on PATH" }
        fd --version
        if ($LASTEXITCODE -ne 0) { throw "fd is not executable on PATH" }
