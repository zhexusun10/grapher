  <title>Grapher</title>
  <style>
    /* Transparent canvas: keep the same mid grey fallback for browsers that do
       not evaluate the colour scheme, and adapt for the tab strip otherwise. */
    .edge { fill: none; stroke: #7d7d7d; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: light) { .edge { stroke: #4a4a4a; } }
    @media (prefers-color-scheme: dark) { .edge { stroke: #c9c9c9; } }
  </style>
