[package]
name = "grapher"
version = "0.1.0"
edition = "2021"

[features]
default = []
benchmark = ["fixture"]
fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
tiny_http = "0.12"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
required-features = ["benchmark"]

[[test]]
name = "core"
path = "tests/core.rs"
required-features = ["fixture"]

[[test]]
name = "engine"
path = "tests/engine.rs"
required-features = ["fixture"]

[[test]]
name = "graph_merge"
path = "tests/graph_merge.rs"

[[test]]
name = "publication"
path = "tests/publication.rs"
required-features = ["fixture"]

[[test]]
name = "publication_state"
path = "tests/publication_state.rs"
required-features = ["fixture"]

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"

[[test]]
name = "shadow"
path = "tests/shadow.rs"
