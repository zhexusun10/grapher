[package]
name = "grapher"
# Release versions live in package.json and Git tags, not this internal crate.
publish = false
edition = "2021"
license = "MIT"

# Keep routine development/fixture builds small. Dependency artifacts still
# reuse Cargo's cache; opt into symbols/incremental locally when debugging.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[features]
default = []
fixture = []
# Opt-in counters for the offline acceptance harness, absent from normal builds.
acceptance = []

[[example]]
name = "conversation_acceptance"
required-features = ["acceptance"]

[[example]]
name = "environment_storage_probe"
required-features = ["acceptance"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Event/checkpoint replay must retain the exact recorded f64 metrics.
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Preserve checked u64/usize SQL conversions, now opt-in in rusqlite 0.41.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
git2 = { version = "0.21", default-features = false }
# Incremental Git blob verification retains libgit2's collision detection.
sha1-checked = { version = "0.10.0", default-features = false, features = ["std"] }
libc = "0.2"
tiny_http = "0.12"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "core"
path = "tests/core.rs"
required-features = ["fixture"]

[[test]]
name = "engine"
path = "tests/engine.rs"
required-features = ["fixture"]

[[test]]
name = "graph_merge"
path = "tests/graph_merge.rs"

[[test]]
name = "publication"
path = "tests/publication.rs"
required-features = ["fixture"]

[[test]]
name = "publication_state"
path = "tests/publication_state.rs"
required-features = ["fixture"]

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"

[[test]]
name = "shadow"
path = "tests/shadow.rs"
