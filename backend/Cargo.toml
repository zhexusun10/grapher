[package]
name = "grapher"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
git2 = { version = "0.20", default-features = false }
libc = "0.2"
tiny_http = "0.12"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[[test]]
name = "core"
path = "tests/core.rs"
required-features = ["fixture"]

[[test]]
name = "engine"
path = "tests/engine.rs"
required-features = ["fixture"]

[[test]]
name = "graph_merge"
path = "tests/graph_merge.rs"

[[test]]
name = "publication"
path = "tests/publication.rs"
required-features = ["fixture"]

[[test]]
name = "publication_state"
path = "tests/publication_state.rs"
required-features = ["fixture"]

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"

[[test]]
name = "shadow"
path = "tests/shadow.rs"
